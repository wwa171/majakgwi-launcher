appId: 'kr.majakgwi.launcher'
productName: 'MajakgwiLauncher'
artifactName: '${productName}-${version}-win64.${ext}'

copyright: 'Copyright © 2026 wwa171'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'zip'
      arch: 'x64'
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  artifactName: '${productName}-${version}-setup.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


publish:
  - provider: 'github'
    owner: 'wwa171'
    repo: 'majakgwi-launcher'

directories:
  buildResources: 'build'
  output: 'dist'